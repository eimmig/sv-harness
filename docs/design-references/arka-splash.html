<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arka — splash</title>
<style>
  :root { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0B1622;
    display: grid;
    place-items: center;
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  .arka-splash { width: min(340px, 80vw); }

  /* --- Sequência ---------------------------------------------------------
     Uma passada só, travando na marca formada. Para soltar o splash quando
     o app terminar de carregar, chame ArkaSplash.done() — ele espera a
     animação fechar antes do fade, porque animação cortada parece bug.  */
  .ring   { stroke-dasharray: 227; stroke-dashoffset: 227;
            animation: draw 2.1s cubic-bezier(.45,0,.25,1) forwards; }
  .comet  { transform-box: view-box; transform-origin: 200px 78px; opacity: 0;
            animation: orbit 2.1s cubic-bezier(.45,0,.25,1) forwards,
                       cfade 2.1s linear forwards; }
  .dial   { transform-box: view-box; transform-origin: 200px 78px; opacity: 0;
            animation: dialin 2.1s linear forwards, spin 14s linear infinite; }
  .spokes { transform-box: view-box; transform-origin: 200px 78px;
            animation: turn 2.1s cubic-bezier(.2,.9,.25,1) forwards; }
  .spoke  { stroke-dasharray: 19; stroke-dashoffset: 19;
            animation: sdraw 2.1s ease-out forwards; }
  .bar    { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0);
            animation: grow 2.1s cubic-bezier(.2,1.3,.4,1) forwards; }
  .b2 { animation-delay: .13s; } .b3 { animation-delay: .26s; }
  .icon   { transform-box: view-box; transform-origin: 200px 78px;
            animation: pop 2.1s ease-out forwards; }
  .pulse  { transform-box: view-box; transform-origin: 200px 78px; opacity: 0;
            animation: ripple 2.1s cubic-bezier(.1,.6,.3,1) forwards; }
  .p2 { animation-delay: .35s; }
  .wipe   { transform-box: view-box;
            animation: sweep 2.1s cubic-bezier(.3,0,.2,1) forwards; }
  .word   { opacity: 0; animation: lift 2.1s ease-out forwards; }

  @keyframes draw   { to { stroke-dashoffset: 0; } }
  @keyframes orbit  { to { transform: rotate(360deg); } }
  @keyframes cfade  { 0%,3%{opacity:0} 6%{opacity:1} 34%{opacity:1} 40%,100%{opacity:0} }
  @keyframes dialin { 0%{opacity:0} 12%,100%{opacity:1} }
  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes turn   { 0%,33%{transform:rotate(-40deg)} 46%,100%{transform:rotate(0)} }
  @keyframes sdraw  { 0%,33%{stroke-dashoffset:19} 46%,100%{stroke-dashoffset:0} }
  @keyframes grow   { 0%,44%{transform:scaleY(0)} 60%,100%{transform:scaleY(1)} }
  @keyframes pop    { 0%,58%{transform:scale(1)} 63%{transform:scale(1.05)} 70%,100%{transform:scale(1)} }
  @keyframes ripple { 0%,58%{transform:scale(1);opacity:.55} 80%,100%{transform:scale(2);opacity:0} }
  @keyframes sweep  { 0%,62%{transform:translateX(-420px)} 82%,100%{transform:translateX(0)} }
  @keyframes lift   { 0%,62%{opacity:0;transform:translateY(8px)} 78%,100%{opacity:1;transform:translateY(0)} }

  /* Saída, disparada por ArkaSplash.done() */
  .arka-splash.is-done { animation: out .4s cubic-bezier(.3,0,.2,1) forwards; }
  @keyframes out { to { opacity: 0; transform: scale(1.04); } }

  /* Sem movimento: marca estática, sem nenhuma animação. */
  @media (prefers-reduced-motion: reduce) {
    .ring, .comet, .dial, .spokes, .spoke, .bar, .icon, .pulse, .wipe, .word,
    .arka-splash.is-done { animation: none; }
    .ring, .spoke { stroke-dashoffset: 0; }
    .bar   { transform: scaleY(1); }
    .dial, .word { opacity: 1; }
    .comet, .pulse { opacity: 0; }
    .wipe  { transform: translateX(0); }
    .arka-splash.is-done { opacity: 0; }
  }
</style>
</head>
<body>

<div class="arka-splash" id="arkaSplash">
  <svg viewBox="0 0 400 220" width="100%" role="img" aria-label="Carregando Arka">
    <title>Arka</title>
    <desc>Um ponto de luz percorre e desenha o anel do cofre, as travessas giram até encaixar, as barras sobem e o nome é revelado.</desc>
    <defs>
      <mask id="arka-mask">
        <rect class="wipe" x="0" y="140" width="420" height="70" fill="#fff"/>
      </mask>
    </defs>

    <circle class="dial"  cx="200" cy="78" r="53" fill="none" stroke="#2C3B49"
            stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle class="pulse" cx="200" cy="78" r="36" fill="none" stroke="#3EC46D" stroke-width="2"/>
    <circle class="pulse p2" cx="200" cy="78" r="36" fill="none" stroke="#3EC46D" stroke-width="1.5"/>

    <g class="icon">
      <circle class="ring" cx="200" cy="78" r="36" fill="none" stroke="#3EC46D"
              stroke-width="6" transform="rotate(-90 200 78)"/>
      <g class="spokes" stroke="#3EC46D" stroke-width="6" stroke-linecap="round">
        <line class="spoke" x1="219.8" y1="58.2" x2="232.5" y2="45.5"/>
        <line class="spoke" x1="180.2" y1="58.2" x2="167.5" y2="45.5"/>
        <line class="spoke" x1="219.8" y1="97.8" x2="232.5" y2="110.5"/>
        <line class="spoke" x1="180.2" y1="97.8" x2="167.5" y2="110.5"/>
      </g>
      <rect class="bar"    x="182" y="82" width="8" height="14" rx="3" fill="#F2F7F5" opacity=".45"/>
      <rect class="bar b2" x="196" y="72" width="8" height="24" rx="3" fill="#F2F7F5" opacity=".75"/>
      <rect class="bar b3" x="210" y="62" width="8" height="34" rx="3" fill="#F2F7F5"/>
    </g>

    <g class="comet"><circle cx="200" cy="42" r="5" fill="#F2F7F5"/></g>

    <g class="word" mask="url(#arka-mask)">
      <text x="200" y="172" text-anchor="middle" fill="#F2F7F5"
            font-size="34" font-weight="400" letter-spacing="-0.4"
            font-family="Inter, 'Segoe UI', system-ui, sans-serif">Ar<tspan
            fill="#3EC46D" font-weight="500">ka</tspan></text>
      <text x="200" y="194" text-anchor="middle" fill="#7A8A93"
            font-size="11" letter-spacing="2.2"
            font-family="Inter, 'Segoe UI', system-ui, sans-serif">GESTÃO DE BANCA</text>
    </g>
  </svg>
</div>

<script>
/* Amarre ao carregamento real do app:
     ArkaSplash.done().then(() => router.start());
   Se o app carregar antes, a animação ainda termina — só depois vem o fade. */
window.ArkaSplash = (function () {
  const el = document.getElementById('arkaSplash');
  const SEQUENCE_MS = 2100;
  const started = performance.now();

  function done() {
    const remaining = Math.max(0, SEQUENCE_MS - (performance.now() - started));
    return new Promise(resolve => {
      setTimeout(() => {
        el.classList.add('is-done');
        setTimeout(() => { el.remove(); resolve(); }, 400);
      }, remaining);
    });
  }
  return { done };
})();
</script>
</body>
</html>
